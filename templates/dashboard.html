<!DOCTYPE html>
<html>
<head>
    <title>CyberShield Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="box">
        <h1>Scan History</h1>

        {% if rows %}
        <table>
            <tr>
                <th>Type</th>
                <th>Result</th>
                <th>Date & Time</th>
            </tr>

            {% for row in rows %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
            <p>No scan records found.</p>
        {% endif %}

        <a class="dashboard" href="/">Home</a>
    </div>
</body>
</html>
